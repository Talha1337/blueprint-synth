name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Prevents cancelling all remaining matrix jobs if one fails
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Match pandas 2.x and 3.x using PEP 440 specifiers
        pandas-version: ["pandas>=2.0.0,<3.0.0", "pandas>=3.0.0a0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Explicitly install the matrix pandas version after base requirements
          pip install "${{ matrix.pandas-version }}"

      - name: Display versions
        run: |
          python -c "import sys; print('Python:', sys.version)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          pytest

  publish:
    # Ensures publishing only runs after all 8 test matrix combinations pass
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Publish step placeholder
        run: echo "Publishing package..."
