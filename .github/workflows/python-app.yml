name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        pandas-version: ["pandas>=2.0.0,<3.0.0", "pandas>=3.0.0a0"]
        exclude:
          # Pandas 3.x requires Python 3.11+
          - python-version: "3.10"
            pandas-version: "pandas>=3.0.0a0"

    steps:
      - uses: actions/checkout@v4

      # 1. Set up uv and the matrix Python version
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # 2. Install project dependencies from pyproject.toml and override pandas
      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install "${{ matrix.pandas-version }}"

      # 3. Verify installed versions
      - name: Display environment versions
        run: |
          uv run python -c "import sys; print('Python:', sys.version)"
          uv run python -c "import pandas; print('Pandas:', pandas.__version__)"

      # 4. Run pytest
      - name: Test with pytest
        run: |
          uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Publish step placeholder
        run: echo "Publishing package..."
