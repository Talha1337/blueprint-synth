[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-synth"
version = "0.1.1"
description = "Synthetic dataset generation library"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/dpforesi/blueprint-synth"
Repository = "https://github.com/dpforesi/blueprint-synth"

[project.scripts]
blueprint-synth = "blueprint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools.package-data]
"blueprint.skill" = ["SKILL.md", "references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
